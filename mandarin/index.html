<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>國語生字練習</title>
<meta name="description" content="康軒版國小一到六年級國語生字：選擇年級與課次，查看生字注音、出聽寫題目。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#f6f3ec;
  --panel:#fffdf8;
  --ink:#22201c;
  --dim:#6b665c;
  --line:#e2dccf;
  --tile:#ffffff;
  --accent:#c2462e;
  --accent-soft:#f7e3dc;
  --grid:#e8b8ab;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#15130f;
    --panel:#1e1b16;
    --ink:#efe9de;
    --dim:#a39c8f;
    --line:#353027;
    --tile:#110f0c;
    --accent:#f08a6e;
    --accent-soft:#3a2219;
    --grid:#5a3226;
  }
}
:root[data-theme="dark"]{
  --ground:#15130f;
  --panel:#1e1b16;
  --ink:#efe9de;
  --dim:#a39c8f;
  --line:#353027;
  --tile:#110f0c;
  --accent:#f08a6e;
  --accent-soft:#3a2219;
  --grid:#5a3226;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;padding:0 16px}
.wrap{max-width:980px;margin:0 auto;padding-block:32px 48px;display:grid;gap:20px}
h1,h2{margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:700;line-height:1.25}
h2{font-size:18px;font-weight:700}
p{margin:0}
[hidden]{display:none!important}
header{display:grid;gap:8px}
.toprow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;color:var(--dim);font-size:13px}
.toprow a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
.toprow a:hover{color:var(--ink);border-color:var(--ink)}
.lede{color:var(--dim)}
button{font:inherit;color:inherit;cursor:pointer}
.theme{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--dim)}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 16px;font-weight:500}
.mode[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
.boxhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.small{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:14px;color:var(--dim)}
.small:hover{color:var(--ink);border-color:var(--ink)}
.primary{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;padding:6px 16px;font-weight:500}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lesson{display:flex;align-items:center;gap:10px;text-align:left;background:var(--tile);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:56px;transition:border-color .15s,background .15s}
.lesson:hover{border-color:var(--accent)}
.lesson:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lesson[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;border:2px solid var(--line);color:var(--dim)}
.lesson[aria-pressed="true"] .num{background:var(--accent);border-color:var(--accent);color:#fff}
.lname{font-size:15px;line-height:1.35}
.summary{color:var(--dim)}
.summary b{color:var(--accent);font-size:20px}
.empty{color:var(--dim);text-align:center;padding:28px 0}
.group{display:grid;gap:10px}
.group + .group{border-top:1px dashed var(--line);padding-top:16px}
.gtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gtitle span{color:var(--dim);font-size:14px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.char{display:grid;place-items:center;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:10px 4px}
.char-in{display:inline-flex;align-items:center}
.char .hzbox{width:62px;height:62px;display:grid;place-items:center;border:1px solid var(--grid);font:400 46px/1 "TW-Kai","BiauKai","DFKai-SB","Kaiti TC","Iansui",serif;
  background-image:linear-gradient(var(--grid),var(--grid)),linear-gradient(var(--grid),var(--grid));
  background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.char .zy{font-size:14px;color:var(--ink);padding-left:3px}
.controls{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--tile);border:0;padding:4px 12px;font-size:14px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.info{color:var(--dim);font-size:14px;display:grid;gap:4px}
.info .miss{color:var(--accent)}
.quiz{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:q}
.quiz li{counter-increment:q;display:flex;align-items:center;gap:12px;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.quiz li::before{content:counter(q);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.quiz li.note{display:block;background:none;border:0;color:var(--dim);text-align:center;padding:20px 0;counter-increment:none}
.quiz li.note::before{content:none}
.qtext{flex:1;font:400 28px/1.35 "TW-Kai","BiauKai","DFKai-SB","Kaiti TC","Iansui",serif;word-break:break-all}
.qtext{display:flex;flex-wrap:wrap;align-items:center;row-gap:6px}
.cell{display:inline-flex;align-items:center;margin-right:3px}
.cell.target .hz{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.zy{position:relative;display:inline-flex;flex-direction:column;justify-content:center;font:400 13px/1.05 "Noto Sans TC",system-ui,sans-serif;color:var(--dim);padding:0 6px 0 1px;min-height:2.6em}
.zy .tone{position:absolute;right:0;bottom:calc(50% - 1.3em)}
.zy .light{position:absolute;left:1px;right:6px;text-align:center;top:calc(50% - 2.9em)}
.tag{flex:none;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.swap{flex:none}
footer{color:var(--dim);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px}
footer a{color:inherit}
@media (max-width:480px){
  h1{font-size:25px}
  .lessons{grid-template-columns:1fr 1fr}
  .lesson{padding:8px;gap:8px}
  .num{width:28px;height:28px;font-size:13px}
  .lname{font-size:14px}
  .chars{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .char .zy{font-size:12px}
  .char .hzbox{width:54px;height:54px;font-size:40px}
  .qtext{font-size:24px}
  .zy{font-size:12px}
  .tag{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="toprow">
      <span></span>
      <button class="theme" id="theme" type="button">深色／淺色</button>
    </div>
    <h1>國語生字練習</h1>
    <p class="lede" id="lede">載入中…</p>
  </header>

  <nav class="modes" role="tablist" aria-label="模式">
    <button class="mode" role="tab" data-mode="list" type="button">生字表</button>
    <button class="mode" role="tab" data-mode="dictation" type="button">聽寫出題</button>
  </nav>

  <section class="box">
    <div class="controls">
      <div class="ctl">年級 <span class="seg" id="seg-grade"></span></div>
      <div class="ctl">學期 <span class="seg" id="seg-sem"></span></div>
    </div>
    <div class="boxhead">
      <h2>選擇課次（可多選）</h2>
      <div class="actions">
        <button class="small" id="all" type="button">全選</button>
        <button class="small" id="none" type="button">清除</button>
      </div>
    </div>
    <div class="lessons" id="lessons"></div>
  </section>

  <section class="box" id="view-list">
    <div class="boxhead">
      <h2>生字</h2>
      <p class="summary" id="summary"></p>
    </div>
    <div id="result"></div>
  </section>

  <section class="box" id="view-dictation" hidden>
    <div class="boxhead">
      <h2>聽寫題目</h2>
      <button class="primary" id="regen" type="button">重新出題</button>
    </div>
    <div class="controls">
      <div class="ctl">題數 <span class="seg" id="seg-n"></span></div>
      <div class="ctl">題型 <span class="seg" id="seg-kind"></span></div>
    </div>
    <div class="info" id="dinfo"></div>
    <ol class="quiz" id="quiz"></ol>
  </section>

  <footer><a id="report" href="https://forms.gle/GBex1gHRLynzHtuT8" target="_blank" rel="noopener">回報問題</a><span>資料來源：教育部教育雲・生字詞彙表；教育部《國語辭典簡編本》（CC BY-ND 3.0 TW）</span></footer>
</div>

<script>
const LESSONS_URL = "lessons.json";
const POOL_URL = "dictation_pool.json";
const STORE_KEY = "hanzi.state";
const CN = ["", "一", "二", "三", "四", "五", "六"];
const $ = id => document.getElementById(id);
let data = null, pool = [];
let vol = null, lessons = [];
let selected = new Set();
let mode = "list";
const opts = {n: 10, kind: "mix", grade: 2, sem: "上"};
let quiz = [], seen = new Set();

function splitTitle(t) {
  const m = t.match(/^(第.+?課)[：:](.*)$/);
  return m ? {label: m[1], name: m[2]} : {label: "", name: t};
}
function cnNum(s) {
  const d = {"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  const core = s.replace(/^第|課$/g, "");
  if (core === "十") return 10;
  if (core.startsWith("十")) return 10 + d[core[1]];
  if (core.includes("十")) return d[core[0]] * 10 + (d[core[2]] || 0);
  return d[core] || "";
}
const volName = v => `${CN[v.grade]}年級${v.sem}學期`;

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({grade: opts.grade, sem: opts.sem, selected: [...selected]})); } catch (e) {}
}
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { return null; }
}
function update() { save(); mode === "list" ? renderResult() : newQuiz(); }

function setVolume(grade, sem, keep) {
  opts.grade = grade; opts.sem = sem;
  vol = data.volumes.find(v => v.grade === grade && v.sem === sem);
  lessons = vol.lessons;
  const ids = new Set(lessons.map(l => l.id));
  selected = new Set((keep || []).filter(id => ids.has(id)));
  $("lede").textContent = `${data.press}・${volName(vol)}（${vol.year.slice(0, 3)} 學年度）`;
  syncSeg($("seg-grade"), grade); syncSeg($("seg-sem"), sem);
  renderLessons();
}

function renderLessons() {
  $("lessons").innerHTML = "";
  lessons.forEach((l, i) => {
    const {label, name} = splitTitle(l.title);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "lesson";
    b.setAttribute("aria-pressed", selected.has(l.id));
    b.title = l.title;
    b.innerHTML = `<span class="num">${cnNum(label) || i + 1}</span><span class="lname"></span>`;
    b.querySelector(".lname").textContent = name;
    b.onclick = () => {
      selected.has(l.id) ? selected.delete(l.id) : selected.add(l.id);
      b.setAttribute("aria-pressed", selected.has(l.id));
      update();
    };
    $("lessons").appendChild(b);
  });
}

// 注音直排在字的右邊：聲調符號在右下，輕聲點在上方
function zhuyinNode(syl) {
  const box = document.createElement("span");
  box.className = "zy";
  for (const ch of syl) {
    const x = document.createElement("span");
    if (ch === "˙") x.className = "light";
    else if ("ˊˇˋ".includes(ch)) x.className = "tone";
    x.textContent = ch;
    box.appendChild(x);
  }
  return box;
}

function renderResult() {
  const chosen = lessons.filter(l => selected.has(l.id));
  const box = $("result");
  box.innerHTML = "";
  if (!chosen.length) {
    $("summary").textContent = "";
    box.innerHTML = '<p class="empty">請在上面點選課次</p>';
    return;
  }
  const total = chosen.reduce((n, l) => n + l.生字.length, 0);
  $("summary").innerHTML = `${chosen.length} 課，共 <b>${total}</b> 個生字`;
  for (const l of chosen) {
    const g = document.createElement("div");
    g.className = "group";
    const head = document.createElement("div");
    head.className = "gtitle";
    head.innerHTML = `<h2></h2><span>${l.生字.length} 個生字</span>`;
    head.firstChild.textContent = l.title;
    g.appendChild(head);
    const grid = document.createElement("div");
    grid.className = "chars";
    l.生字.forEach((c, j) => {
      const d = document.createElement("div");
      d.className = "char";
      const inner = document.createElement("span");
      inner.className = "char-in";
      const hz = document.createElement("span");
      hz.className = "hzbox"; hz.textContent = c;
      inner.append(hz, zhuyinNode(l.注音[j] || ""));
      d.appendChild(inner);
      grid.appendChild(d);
    });
    g.appendChild(grid);
    box.appendChild(g);
  }
}

/* ---------- 聽寫出題 ---------- */
// 可用字 = 一年級上學期起到所選最後一課教過的生字（含一到十、百）；新字 = 所選課的生字
function scope() {
  const chosen = lessons.filter(l => selected.has(l.id));
  const last = chosen[chosen.length - 1];
  const targets = new Set(chosen.flatMap(l => l.生字));
  const known = Object.values(data.first).filter(i => i <= last.i).length;
  return {last, targets, known};
}

function candidates(sc) {
  return pool.filter(it => {
    if (it.lv > sc.last.i) return false;
    if (opts.kind !== "mix" && it.k !== opts.kind) return false;
    for (const c of it.h) if (sc.targets.has(c)) return true;
    return false;
  });
}

// 不和已選題目重複：文字相同、互相包含都算重複
const clash = (a, list) => list.some(b => b.h.includes(a.h) || a.h.includes(b.h));

function pickOne(cands, chosen, sc, wantKind) {
  const used = new Map();
  chosen.forEach(it => new Set(it.h).forEach(c => sc.targets.has(c) && used.set(c, (used.get(c) || 0) + 1)));
  let best = null, bestScore = -Infinity;
  for (const it of cands) {
    if (seen.has(it.t) || clash(it, chosen)) continue;
    let score = it.q * 2 + Math.random() * 3;
    if (it.g > opts.grade) score -= 3;  // 高年級課本的詞句排後面
    for (const c of new Set(it.h)) if (sc.targets.has(c)) score += used.get(c) ? -1.5 * used.get(c) : 8;
    if (wantKind && it.k !== wantKind) score -= 20;
    if (score > bestScore) { bestScore = score; best = it; }
  }
  return best;
}

// 混合題型：每 5 題有 2 句短句
const kindAt = i => opts.kind !== "mix" ? null : (i % 5 === 1 || i % 5 === 3) ? "s" : "w";

function newQuiz() {
  quiz = []; seen = new Set();
  if (selected.size) {
    const sc = scope(), cands = candidates(sc);
    for (let i = 0; i < opts.n; i++) {
      const it = pickOne(cands, quiz, sc, kindAt(i));
      if (!it) break;
      quiz.push(it); seen.add(it.t);
    }
  }
  renderQuiz();
}

function swap(i) {
  const sc = scope(), cands = candidates(sc);
  const others = quiz.filter((_, j) => j !== i);
  let it = pickOne(cands, others, sc, quiz[i].k);
  if (!it) {  // 換完一輪了：清掉換過的紀錄再找
    seen = new Set(quiz.map(q => q.t));
    it = pickOne(cands, others, sc, quiz[i].k);
  }
  if (!it) return;
  quiz[i] = it; seen.add(it.t);
  renderQuiz();
}

function note(ol, text) {
  const li = document.createElement("li");
  li.className = "note"; li.textContent = text;
  ol.appendChild(li);
}

function renderQuiz() {
  const ol = $("quiz"), info = $("dinfo");
  ol.innerHTML = ""; info.innerHTML = "";
  if (!selected.size) { note(ol, "請在上面點選課次"); return; }
  const sc = scope();
  const covered = new Set(quiz.flatMap(it => [...it.h].filter(c => sc.targets.has(c))));
  const missing = [...sc.targets].filter(c => !covered.has(c));
  const noCand = missing.filter(c => !pool.some(it => it.lv <= sc.last.i && it.h.includes(c)));
  const s1 = document.createElement("span");
  s1.textContent = `用字範圍：一年級上學期到${volName(vol)}${splitTitle(sc.last.title).label}學過的 ${sc.known} 字（含一到十、百）。` +
    `所選課次的新字 ${sc.targets.size} 個，這組題目考到 ${covered.size} 個（標底線的字）。`;
  info.appendChild(s1);
  if (missing.length) {
    const s2 = document.createElement("span");
    s2.className = "miss";
    s2.textContent = `這組沒考到：${missing.join("、")}` +
      (noCand.length ? `（其中 ${noCand.join("、")} 在詞庫裡找不到只用學過的字組成的詞句）` : "");
    info.appendChild(s2);
  }
  if (!quiz.length) { note(ol, "找不到符合的詞句，請換題型或多選幾課"); return; }
  quiz.forEach((it, i) => {
    const li = document.createElement("li");
    const text = document.createElement("span");
    text.className = "qtext";
    let k = 0;  // 注音依漢字順序對應，標點沒有注音
    for (const c of it.t) {
      const cell = document.createElement("span");
      cell.className = "cell" + (sc.targets.has(c) ? " target" : "");
      const hz = document.createElement("span");
      hz.className = "hz"; hz.textContent = c;
      cell.appendChild(hz);
      if (!/[，。！？、]/.test(c)) cell.appendChild(zhuyinNode(it.zy[k++] || ""));
      text.appendChild(cell);
    }
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = it.k === "s" ? "短句" : "詞語";
    const b = document.createElement("button");
    b.type = "button"; b.className = "small swap"; b.textContent = "換一題";
    b.onclick = () => swap(i);
    li.append(text, tag, b);
    ol.appendChild(li);
  });
  if (quiz.length < opts.n) note(ol, `只找到 ${quiz.length} 題不重複的詞句`);
}

function segment(el, key, choices, onPick) {
  for (const [val, label] of choices) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.val = val;
    b.setAttribute("aria-pressed", opts[key] === val);
    b.onclick = () => onPick(val);
    el.appendChild(b);
  }
}
function syncSeg(el, val) {
  [...el.children].forEach(x => x.setAttribute("aria-pressed", x.dataset.val === String(val)));
}

function setMode(m) {
  mode = m === "dictation" ? "dictation" : "list";
  document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === mode));
  $("view-list").hidden = mode !== "list";
  $("view-dictation").hidden = mode !== "dictation";
  history.replaceState(null, "", location.pathname + location.search + (mode === "list" ? "" : "#" + mode));
  mode === "list" ? renderResult() : newQuiz();
}

document.querySelectorAll(".mode").forEach(b => b.onclick = () => setMode(b.dataset.mode));
$("all").onclick = () => { lessons.forEach(l => selected.add(l.id)); renderLessons(); update(); };
$("none").onclick = () => { selected.clear(); renderLessons(); update(); };
$("regen").onclick = newQuiz;

// 回報問題：開 Google 表單，「回報錯誤內容」預先帶入當時的頁面狀態
const REPORT_FORM = "https://docs.google.com/forms/d/e/1FAIpQLSc3fcz_REPZeE0hKo-fZY1fxF8f5aru2UA3z1r7nxitS6fK5w/viewform";
const REPORT_ENTRY = "entry.1285770077";
$("report").onclick = () => {
  const chosen = lessons.filter(l => selected.has(l.id)).map(l => splitTitle(l.title).label.replace(/^第|課$/g, ""));
  const lines = ["（請在這裡寫下哪裡有問題）", "", "---- 當時的頁面（自動帶入）----",
    `模式：${mode === "list" ? "生字表" : "聽寫出題"}`,
    `冊別：${vol ? volName(vol) : ""}　課次：${chosen.length ? "第" + chosen.join("、") + "課" : "未選"}`];
  if (mode === "dictation" && quiz.length) quiz.forEach((it, i) => lines.push(`${i + 1}. ${it.t}（${it.zy.join(" ")}）`));
  lines.push(`網址：${location.href}`);
  $("report").href = `${REPORT_FORM}?usp=pp_url&${REPORT_ENTRY}=${encodeURIComponent(lines.join("\n"))}`;
};
$("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
segment($("seg-n"), "n", [[5, "5"], [10, "10"], [15, "15"], [20, "20"]], v => { opts.n = v; syncSeg($("seg-n"), v); newQuiz(); });
segment($("seg-kind"), "kind", [["mix", "混合"], ["w", "詞語"], ["s", "短句"]], v => { opts.kind = v; syncSeg($("seg-kind"), v); newQuiz(); });

Promise.all([LESSONS_URL, POOL_URL].map(u => fetch(u).then(r => r.json()))).then(([d, p]) => {
  data = d;
  pool = p.items.map(([t, k, q, zy, lv, g]) => ({t, k, q, zy: zy.split(" "), lv, g, h: t.replace(/[，。！？、]/g, "")}));
  segment($("seg-grade"), "grade", [1, 2, 3, 4, 5, 6].map(g => [g, CN[g]]), g => { setVolume(g, opts.sem); update(); });
  segment($("seg-sem"), "sem", [["上", "上"], ["下", "下"]], s => { setVolume(opts.grade, s); update(); });
  // 網址 ?v=2上&l=1,3 可直接指定年級、學期與課次
  const q = new URLSearchParams(location.search);
  const st = load() || {};
  const vm = (q.get("v") || "").match(/^([1-6])([上下])$/);
  const grade = vm ? +vm[1] : st.grade || 2, sem = vm ? vm[2] : st.sem || "上";
  const v = data.volumes.find(x => x.grade === grade && x.sem === sem);
  const keep = q.get("l") ? q.get("l").split(",").map(n => v.lessons[+n - 1]?.id).filter(Boolean) : st.selected;
  setVolume(grade, sem, keep);
  setMode(location.hash.slice(1));
}).catch(() => { $("lede").textContent = "資料載入失敗"; });
</script>
</body>
